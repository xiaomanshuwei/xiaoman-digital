<link href="assets/style.css" rel="stylesheet"/>
<link rel="icon" href="assets/xiaoman-mark.png"></head>
<body id="top" class="page-contact">
<header class="site-header">
<div class="container nav">
<a class="brand" href="index.html"><img alt="小滿數位 XIAOMAN DIGITAL STUDIO" class="brand-logo" src="assets/xiaoman-logo.png"/></a>
<button aria-label="開啟選單" class="menu-toggle">☰</button>
<nav class="nav-links"><a href="index.html">首頁</a><a href="services.html">服務</a><a href="works.html">作品</a><a href="cases.html">案例</a><a href="process.html">流程</a><a href="pricing.html">方案</a><a href="about.html">關於</a><a href="faq.html">常見問題</a><a aria-current="page" class="active nav-cta" href="contact.html">聯絡詢問</a></nav>
</div>
</header>
<main class="page-main">
<section class="contact-section" id="contact">
<div class="container contact-grid">
<div><p class="eyebrow">LET'S TALK</p><h2>有個想法？<br/><em>先告訴我。</em></h2><p>不用把需求想得很完整。把你現在想到的內容告訴我，我會協助你整理成比較清楚的網站需求。</p></div>
<form class="contact-form" id="contactForm">
<label>姓名／稱呼<input name="name" placeholder="例如：王小姐" required=""/></label>
<label>公司／品牌<input name="company" placeholder="公司或品牌名稱"/></label>
<label>Email<input name="email" placeholder="you@example.com" required="" type="email"/></label>
<label>想做什麼？<select name="type"><option>企業形象網站</option><option>一頁式網站</option><option>品牌／商品網站</option><option>電商網站</option><option>客製管理系統</option><option>AI 功能整合</option><option>其他</option></select></label>
<label>預算區間<select name="budget"><option>尚未確定</option><option>NT$8,000～15,000</option><option>NT$15,000～30,000</option><option>NT$30,000～50,000</option><option>NT$50,000 以上</option></select></label>
<label>是否已有網域<select name="domain"><option>尚未購買</option><option>已有網域</option><option>不確定</option></select></label>
<label>是否已有 Logo<select name="logo"><option>已有</option><option>尚未有</option><option>不確定</option></select></label>
<label>需要手機版 RWD<select name="rwd"><option>需要</option><option>不需要</option><option>不確定</option></select></label>
<label>需要多語系<select name="languages"><option>繁體中文</option><option>繁中＋英文</option><option>繁中＋英文＋日文</option><option>其他／不確定</option></select></label>
<label>需求說明<textarea name="message" placeholder="簡單描述你想做的網站、參考網站或需要的功能" required="" rows="5"></textarea></label>
<button class="btn btn-dark full" type="submit">送出詢問 <span>↗</span></button>
<p aria-live="polite" class="form-status" id="formStatus"></p><p class="form-note">送出後，資料會寫入你的 Google 試算表，並由 Google Apps Script 寄送 Email 通知。</p>
</form>
</div>
</section>
</main>
